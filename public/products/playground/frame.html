<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- The server sends the full policy as a header (vercel.json, scripts/playground.ts), with the sandbox and
         frame-ancestors that a meta tag cannot carry. This copy holds even where the header is missing. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Playground canvas</title>
    <link rel="stylesheet" href="./frame.css" />
    <script src="./frame.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
