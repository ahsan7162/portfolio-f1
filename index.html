<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The words people hiring search for come first: the roles, then "portfolio", then the name. -->
    <title>Full Stack Developer &amp; AI Engineer Portfolio | Muhammad Ahsan</title>
    <meta name="description" content="Portfolio of Muhammad Ahsan, full stack developer and AI developer. Software engineer building React, Go, Python and .NET apps and AI agents. Open to new roles." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="author" content="Muhammad Ahsan" />
    <meta name="google-site-verification" content="uNGttQ3RQai-fs4wjR4mQkuegHnikhgng9Tj6Bbng2s" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Muhammad Ahsan" />
    <meta property="og:title" content="Muhammad Ahsan, Full Stack / AI Developer" />
    <meta property="og:description" content="Full stack and AI developer: React, Go, Python and .NET, plus AI agents. 450+ shipped on a platform I built." />
    <!-- Canonical, og:url, og:image (public/og.jpg) and the JSON-LD: written by scripts/prerender.ts from SITE_URL. -->
    <!--seo-->
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Before first paint: classes from the URL flags and the OS setting, and the
      // start-lights loader, shown only on a first visit with motion allowed.
      (function () {
        try {
          var d = document.documentElement;
          var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var q = location.search;
          if (q.indexOf('nomotion') >= 0) d.classList.add('no-motion'); // CSS transitions off too (index.css)
          // The helmet will fly: open its slot in the About sentence before first paint, so
          // the sentence never reflows (GLCanvas.tsx closes it again if WebGL is out). The
          // 3D starts as glWanted() decides (prefs.ts): the nav toggle's pick, else off on
          // phones, weak devices and Save-Data. Made here too, so there the slot stays shut.
          else if (!rm && q.indexOf('nogl') < 0) {
            var pick = null;
            try { pick = localStorage.getItem('v2-3d'); } catch (e) {}
            var phone = window.matchMedia('(hover: none) and (pointer: coarse)').matches && Math.min(screen.width, screen.height) < 768;
            if (pick === 'on' || (pick !== 'off' && !phone && (navigator.hardwareConcurrency || 8) > 4 && !(navigator.connection && navigator.connection.saveData))) d.classList.add('helmet-flight');
          }
          if (!rm && !location.hash && q.indexOf('nointro') < 0 && q.indexOf('nomotion') < 0 && !sessionStorage.getItem('v2-intro-seen')) d.classList.add('intro');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
